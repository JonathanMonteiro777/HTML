<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div {
            display: inline-block;
            background-color: lightgrey;
            border: ipx solid black;
            text-align: center;
            height: 200px;
            width: 200px;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            background-color: green;
            width: 200;
            transition: 0.2s;
        }

        div:hover {
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div id="01">01
        <p>exemplo</p>
    </div>
    <div id="02">02</div>
    <div id="03">03</div>
</body>
</html>
