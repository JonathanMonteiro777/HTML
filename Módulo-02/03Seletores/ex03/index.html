<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* seletores personalizados
          # - id
          . - class
          : - pseudo-class
         :: - pseudo-element
          > - children
        */
        
        body {
            font: normal 1em Arial;
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>

    <ul>
        <li><a href="http://www.github.com" target="_blank">GitHub</a></li>
        <li><a href="http://www.youtube.com" class="">Youtube</a></li>
        <li><a href="http://www.facebook.com">Facebook</a></li>
    </ul>
</body>
</html>
