<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Componente Círculo Cromático</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    section.main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .circle-container {
      position: relative;
      width: 70vw;
      max-width: 320px;
      aspect-ratio: 1 / 1;
      animation: rotateCircle 20s linear infinite;
    }

    .paused {
      animation-play-state: paused !important;
    }

    @keyframes rotateCircle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .color {
      position: absolute;
      width: 20%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      transform-origin: 50% 180%;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .color:hover {
      transform: scale(1.2);
      z-index: 10;
    }

    .color::after {
      content: attr(data-cor);
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .color:hover::after {
      opacity: 1;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #218838;
    }

    a {
      text-decoration: none;
      color: white;
      background-color: #007bff;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background 0.3s ease;
    }

    a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <section class="main">
    <div class="circle-container" id="circle"></div>

    <div class="controls">
      <button id="toggleBtn">⏸ Pausar</button>
      <a href="index.html">home</a>
    </div>
  </section>

  <script>
    const cores = [
      'red', 'orange', 'yellow', 'lime', 'green', 'cyan',
      'blue', 'indigo', 'violet', 'pink', 'deeppink', 'crimson'
    ];

    const container = document.getElementById('circle');
    const toggleBtn = document.getElementById('toggleBtn');
    let isPaused = false;

    // Gerar o círculo cromático
    cores.forEach((cor, index) => {
      const div = document.createElement('div');
      div.classList.add('color');
      div.style.background = cor;
      div.setAttribute('data-cor', cor);

      const angulo = (360 / cores.length) * index;
      div.style.transform = `rotate(${angulo}deg) translateY(-120%)`;

      container.appendChild(div);
    });

    // Controlar rotação
    toggleBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      container.classList.toggle('paused', isPaused);
      toggleBtn.textContent = isPaused ? '▶ Continuar' : '⏸ Pausar';
    });
  </script>

</body>
</html>
