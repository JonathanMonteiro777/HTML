<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Hardware</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 20px;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: none;
        }

        .link-curso {
            display: inline-block;
            background-color: #2196f3;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }

        .link-curso:hover {
            background-color: #1976d2;
        }

        .voltar {
            display: inline-block;
            margin-top: 30px;
        }

        .voltar img {
            width: 50px;
            transition: transform 0.2s;
        }

        .voltar img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>Curso de Hardware</h1>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/iT6E92Kt38o?si=Z54SgA0jpPXktHp8"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
    </div>

    <a class="link-curso" href="https://youtu.be/iT6E92Kt38o?si=-wdgUDT9b-OU4i5R" target="_blank" rel="noopener noreferrer">
        ▶️ Veja o curso completo no YouTube
    </a>

    <div class="voltar">
        <a href="../index.html">
            <img src="../img/voltar.png" alt="Ícone de voltar para a página principal">
        </a>
    </div>

</body>

</html>
