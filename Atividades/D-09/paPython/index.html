<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Python</title>
    <style>
        body {
            background-color: #000; /* deixa o fundo preto*/
            color: #fff; /* deixa o texto barnco*/
            font-family: Arial, sans-serif; /* fonte do texto sem serifa */
            text-align: center; /* centralisa o texto */
            padding: 20px; /* coloca um respiro interno no body, afstando o conteúdo das bordas da tela */
        }

        h1 {
            font-size: 2rem; /* tamanho da fonte */
            margin-bottom: 20px; /* margem na parte abaixo do titulo */
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 20px;
            padding-bottom: 56.25%; /* proporção 16:9 */
            height: 0;
        } 
        

        .video-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: none;
        }

        .link-curso {
            display: inline-block;
            background-color: transparent;
            color: #fff;
            padding: 10px 20px;
            border: 2px solid #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
            margin-bottom: 10px;
        }

        .link-curso:hover {
            background-color: #fff;
            color: #000;
        }

        .voltar {
            display: inline-block;
            margin-top: 10px;
        }

        .voltar img {
            width: 50px;
            transition: transform 0.2s;
        }

        .voltar img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>Curso de Python</h1>

    <div class="video-container">
        <iframe  src="https://www.youtube.com/embed/S9uPNppGsGo?si=VTkyjaZDuy0THIR4"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
    </div>

    <a class="link-curso" href="https://youtu.be/S9uPNppGsGo?si=BkJk-ETFHvO6LRp_" target="_blank" rel="noopener noreferrer">
        ▶️ Veja o curso completo no YouTube
    </a>

    <div class="voltar">
        <a href="../index.html">
            <img src="../img/voltar.png" alt="Ícone de voltar para a página principal">
        </a>
    </div>

</body>

</html>
