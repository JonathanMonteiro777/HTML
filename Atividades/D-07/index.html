<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAFIO IMAGENS FLEXIVEIS</title>
    <style>
        img {
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>Imagem Flexível</h1>


    <p>Você esta vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor
        experiência.</p>

    <picture>
        <source media="(min-width: 1200px)" srcset="img/paisagem-g.png" type="image/png">
        <source media="(min-width: 601px)" srcset="img/paisagem-m.png" type="image/png">
        <source media="(max-width: 600px)" srcset="img/paisagem-p.png" type="image/png">
        <img src="img/paisagem-g.png" alt="imagem-flexivel">
    </picture>


</body>

</html>
